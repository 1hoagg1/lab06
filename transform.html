<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            background-color: red;
            transition: width 2s, height 3s, background-color 4s;
        }
        .box:hover{
            width: 300px;
            height: 300px;
            background-color: orange;
        }
        .a{
            width: 120px;
            height: 50px;
            background-color: yellow;
            transform: rotate(20deg);
        }
        .b{
            width: 120px;
            height: 50px;
            background-color: yellow;
            transform: skewY(20deg);
        }
        .c{
            width: 120px;
            height: 50px;
            background-color: yellow;
            transform: scaleY(1.5);
        }
        .d{
            width: 120px;
            height: 50px;
            background-color: yellow;
            transform: translate(100%);
        }
    </style>
</head>
<body>
    <h1>
        Hover CSS - Áp dụng các thuộc tính CSS khi hover(hover - sự kiện khi di chuột vào khối đó)
    </h1>
    <div class="box"></div>
    <h2>transform: rotate(20deg)</h2>
    <div class="a">Rotate - Xoay</div>
    <h2>transform: skewY(20deg)</h2>
    <div class="b">skewY - Nghiêng</div>
    <h2>transform: scaleY(1.5)</h2>
    <div class="c">scale - Phóng to</div>
    <h2>transform: translateX(100%)</h2>
    <div class="d">translate - di chuyển</div>
    
</body>
</html>
